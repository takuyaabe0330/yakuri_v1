<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薬理学 薬剤・作用機序 5択クイズ</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary-color: #00897b;
      --hover-color: #00695c;
      --bg-color: #eef2f5;
      --text-color: #263238;
      --card-bg: #ffffff;
    }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #app {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      margin: 20px;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      box-sizing: border-box;
      position: relative;
    }
    h1, h2 { text-align: center; margin-top: 0; }
    .hidden { display: none !important; }
    
    .filter-group {
      margin: 20px 0;
      text-align: center;
    }
    .filter-group label {
      font-weight: bold;
      margin-right: 8px;
    }
    .filter-select {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #b0bec5;
      max-width: 100%;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      margin: 10px 0;
      background-color: var(--card-bg);
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
      transition: all 0.2s ease;
    }
    .btn:hover { background-color: var(--primary-color); color: #fff; }
    .btn-primary {
      background-color: var(--primary-color);
      color: #fff;
      text-align: center;
      font-weight: bold;
      border: none;
    }
    .btn-primary:hover { background-color: var(--hover-color); }
    .btn:disabled { cursor: not-allowed; opacity: 0.75; }
    .correct-btn { background-color: #2e7d32 !important; color: white !important; border-color: #2e7d32 !important; }
    .wrong-btn { background-color: #c62828 !important; color: white !important; border-color: #c62828 !important; }
    
    #progress { text-align: center; font-weight: bold; margin-bottom: 15px; color: #546e7a; }
    #question-text { font-size: 17px; line-height: 1.6; margin-bottom: 20px; font-weight: bold; }
    #explanation-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #e0f2f1;
      border-left: 5px solid var(--primary-color);
      border-radius: 4px;
    }
    .score-display { font-size: 24px; text-align: center; margin: 20px 0; font-weight: bold; }
    .high-score { text-align: center; font-size: 14px; color: #78909c; margin-top: 10px; }

    .perfect-banner {
      animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      text-align: center;
      margin-bottom: 15px;
    }
    .perfect-badge {
      display: inline-block;
      font-size: 18px;
      font-weight: bold;
      color: #b78103;
      background: linear-gradient(135deg, #fff3b0 0%, #ffd700 50%, #ffae00 100%);
      padding: 8px 24px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(255, 174, 0, 0.5);
      border: 2px solid #fff;
      animation: pulse 1.8s infinite;
    }
    .perfect-title {
      font-size: 28px;
      color: #e65100;
      margin: 15px 0 5px 0;
    }
    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="start-screen">
      <h1>薬理学 薬剤・作用機序 5択クイズ</h1>
      <p style="text-align: center;">全120問収録（6大薬効群 各20問）</p>

      <div class="filter-group">
        <label for="cat-select">出題カテゴリ：</label>
        <select id="cat-select" class="filter-select" onchange="updateHighScoreDisplay()">
          <option value="all">全薬効群 ランダムミックス</option>
          <option value="循環器系（降圧薬・利尿薬）">循環器系（降圧・利尿薬）</option>
          <option value="感染症治療薬（抗菌・抗ウイルス・抗真菌薬）">感染症（抗菌・抗ウイルス・抗真菌）</option>
          <option value="中枢神経系（向精神薬・抗てんかん薬）">中枢神経系（向精神・抗てんかん薬）</option>
          <option value="抗悪性腫瘍薬（分子標的薬・抗体薬等）">抗悪性腫瘍薬（分子標的・抗体薬等）</option>
          <option value="代謝・内分泌系（糖尿病・脂質異常症・痛風治療薬）">代謝・内分泌系（糖尿病・脂質・痛風）</option>
          <option value="消化器・呼吸器・疼痛炎症治療薬">消化器・呼吸器・疼痛炎症治療薬</option>
        </select>
      </div>

      <div class="high-score" id="high-score-display">過去の最高得点: -- 点</div>
      <button class="btn btn-primary" onclick="startQuiz()" style="margin-top: 25px;">クイズを始める（10問）</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div id="progress">問題 1 / 10</div>
      <div id="question-text"></div>
      <div id="options-container"></div>

      <div id="explanation-box" class="hidden">
        <h3 id="result-title" style="margin-top: 0;"></h3>
        <p id="explanation-text"></p>
        <button class="btn btn-primary" onclick="nextQuestion()" style="margin-top: 15px;">次の問題へ</button>
      </div>
    </div>

    <div id="result-screen" class="hidden">
      <div id="perfect-celebration" class="perfect-banner hidden">
        <div class="perfect-badge">💊 薬理マスター・完全制覇 💊</div>
        <h2 class="perfect-title">満点達成！作用機序完全網羅！</h2>
      </div>

      <h1 id="result-heading">結果発表</h1>
      <div class="score-display" id="final-score"></div>
      <div class="high-score" id="new-high-score-msg" class="hidden" style="color: #d32f2f; font-weight: bold;"></div>
      <button class="btn btn-primary" onclick="resetQuiz()" style="margin-top: 30px;">トップに戻る</button>
    </div>
  </div>

  <script>
    const allQuizData = [
  {
    "question": "アムロジピンの作用機序として正しいものはどれか。",
    "options": [
      "電位依存性L型Ca2+チャネルを遮断し、血管平滑筋を弛緩させる。",
      "アンジオテンシン変換酵素（ACE）を阻害し、アンジオテンシンII産生を抑制する。",
      "血管平滑筋のAT1受容体を遮断し、血管収縮を抑制する。",
      "遠位曲尿管のNa+-Cl-共輸送体を阻害し、利尿作用を示す。",
      "心筋および血管平滑筋のβ1受容体を遮断し、心拍出量を低下させる。"
    ],
    "answerIndex": 0,
    "explanation": "アムロジピンは血管平滑筋の電位依存性L型Ca2+チャネルを遮断して細胞内へのCa2+流入を抑制し、末梢血管抵抗を減少させて血圧を低下させます。高血圧症や狭心症に適応を有します。",
    "id": 1,
    "category": "循環器系（降圧薬・利尿薬）"
  },
  {
    "question": "エナラプリルの作用機序として正しいものはどれか。",
    "options": [
      "アンジオテンシンII受容体（AT1）を選択的に遮断する。",
      "アンジオテンシン変換酵素（ACE）を阻害し、アンジオテンシンIIの生成を抑制する。",
      "レニン活性を直接阻害してアンジオテンシノーゲンからのアンジオテンシンI産生を抑える。",
      "ネプリライシンを阻害し、ナトリウム利尿ペプチドの分解を抑制する。",
      "鉱質コルチコイド受容体（MR）に拮抗し、アルドステロン作用を阻害する。"
    ],
    "answerIndex": 1,
    "explanation": "エナラプリルは体内で加水分解されて活性代謝物エナラプリラトとなり、ACEを阻害してアンジオテンシンIIの生成を抑制し、ブラジキニンの分解も抑制します。高血圧症や慢性心不全に適応されます。",
    "id": 2,
    "category": "循環器系（降圧薬・利尿薬）"
  },
  {
    "question": "カンデサルタンシレキセチルの作用機序として正しいものはどれか。",
    "options": [
      "血管平滑筋の電位依存性T型Ca2+チャネルを選択的に遮断する。",
      "アドレナリンα1受容体を遮断して血管平滑筋を弛緩させる。",
      "アンジオテンシンII受容体のAT1サブタイプを選択的に遮断する。",
      "血管内皮細胞のプロスタサイクリン受容体を刺激する。",
      "腎集合管のバソプレシンV2受容体を遮断する。"
    ],
    "answerIndex": 2,
    "explanation": "カンデサルタンは活性体に変換後、アンジオテンシンII受容体のAT1サブタイプに選択的かつ競合的に拮抗し、昇圧およびアルドステロン分泌を抑制します。高血圧症や慢性心不全に適応します。",
    "id": 3,
    "category": "循環器系（降圧薬・利尿薬）"
  },
  {
    "question": "ヘンレループ上行脚太部のNa+-K+-2Cl-共輸送体（NKCC2）を阻害する利尿薬はどれか。",
    "options": [
      "ヒドロクロロチアジド",
      "スピロノラクトン",
      "アセタゾラミド",
      "フロセミド",
      "トリアムテレン"
    ],
    "answerIndex": 3,
    "explanation": "フロセミドはループ利尿薬であり、ヘンレループ上行脚太部のNa+-K+-2Cl-共輸送体（NKCC2）を阻害することで強力な利尿作用を示します。高血圧症や心性・腎性・肝性浮腫に適応します。",
    "id": 4,
    "category": "循環器系（降圧薬・利尿薬）"
  },
  {
    "question": "遠位曲尿管のNa+-Cl-共輸送体（NCC）を阻害して降圧・利尿効果を示す薬剤はどれか。",
    "options": [
      "トリクロルメチアジド",
      "ブメタニド",
      "トルバプタン",
      "エプレレノン",
      "カルペリチド"
    ],
    "answerIndex": 0,
    "explanation": "トリクロルメチアジドはサイアザイド系利尿薬で、遠位曲尿管のNa+-Cl-共輸送体（NCC）を阻害してNa+および水分の再吸収を抑制します。本態性高血圧症や各種浮腫の治療に広く用いられます。",
    "id": 5,
    "category": "循環器系（降圧薬・利尿薬）"
  },
  {
    "question": "スピロノラクトンの作用機序として正しいものはどれか。",
    "options": [
      "皮質集合管上皮細胞の管腔側Na+チャネル（ENaC）を直接遮断する。",
      "遠位尿細管・皮質集合管の鉱質コルチコイド受容体（MR）に拮抗する。",
      "炭酸脱水酵素を阻害し、近位尿細管での重炭酸イオン再吸収を抑制する。",
      "バソプレシンV2受容体に拮抗し、アクアポリン2の膜移行を阻止する。",
      "SGLT2トランスポーターを阻害し、グルコースとNa+の排泄を促進する。"

    "answerIndex": 1,
    "explanation": "スピロノラクトンは皮質集合管主細胞に存在する鉱質コルチコイド（アルドステロン）受容体を遮断し、カリウム排泄を抑えつつNa+および水分の排泄を促すカリウム保持性利尿薬です。高血圧症や原発性アルドステロン症、心不全に用いられます。",
    "id": 6,
    "category": "循環器系（降圧薬・利尿薬）"
  },
  {
    "question": "ビソプロロールフマル酸塩の主な薬理作用として正しいものはどれか。",
    "options": [
      "アドレナリンα1受容体を選択的に遮断する。",
      "アドレナリンβ2受容体を選択的に刺激する。",

      "アドレナリンβ1受容体を選択的に遮断し、心拍数や心収縮力を低下させる。",

    ],
    "answerIndex": 3,
    "explanation": "ビソプロロールは心臓に優位に分布するアドレナリンβ1受容体を選択的に遮断し、心拍数減少および心拍出量低下をもたらします。本態性高血圧症、狭心症、慢性心不全や心房細動の頻脈管理に適応します。",
    "id": 7,
    "category": "循環器系（降圧薬・利尿薬）"
  },
  {
    "question": "カルベジロールの作用機序として正しいものはどれか。",
    "options": [
      "アドレナリンα1受容体およびβ受容体を非選択的に遮断する。",
      "アドレナリンα2受容体を選択的に刺激して交感神経活動を抑制する。",
      "アドレナリンβ1受容体のみを選択的に刺激する。",
      "血管平滑筋のAT1受容体およびエンドセリン受容体を二重遮断する。",
      "電位依存性N型Ca2+チャネルのみを選択的に阻害する。"
    ],
    "answerIndex": 0,
    "explanation": "カルベジロールはα1受容体遮断による血管拡張作用と、非選択的β受容体遮断による心保護・降圧作用を併せ持ちます。本態性高血圧症、狭心症、慢性心不全に適応します。",
    "id": 8,
    "category": "循環器系（降圧薬・利尿薬）"
  },
  {
    "question": "近位尿細管におけるグルコースおよびNa+の再吸収を担う担体を阻害し、心不全や慢性腎臓病にも用いられる薬剤はどれか。",
    "options": [
      "ダパグリフロジン",

      "ピオグリタゾン",
      "メトホルミン",
      "グリクラジド"
    ],
    "answerIndex": 0,
    "explanation": "ダパグリフロジンは腎近位尿細管のSGLT2（ナトリウム・グルコース共輸送体2）を選択的に阻害し、浸透圧利尿と心腎保護効果を発揮します。2型糖尿病に加え、慢性心不全や慢性腎臓病（CKD）に適応します。",
    "id": 9,
    "category": "循環器系（降圧薬・利尿薬）"
  },
  {

    "options": [

    "answerIndex": 1,
    "explanation": "サクビトリルバルサルタン（ARNI）は、ネプリライシン阻害薬サクビトリルとARBバルサルタンの複合体であり、ナトリウム利尿ペプチドの保護およびレニン・アンジオテンシン系の遮断により慢性心不全や高血圧症を改善します。",
    "id": 10,
    "category": "循環器系（降圧薬・利尿薬）"
  },
  {

    "options": [

    "explanation": "シルニジピンはL型Ca2+チャネルだけでなくN型Ca2+チャネルも同時に遮断し、交感神経末端からのノルアドレナリン遊離を抑制することで反射性頻脈を起こしにくい持続性降圧薬です。高血圧症に適応します。",
    "id": 11,
    "category": "循環器系（降圧薬・利尿薬）"
  },
  {

    "category": "循環器系（降圧薬・利尿薬）"
  },
  {

    "options": [

  },

    const QUESTION_COUNT = 10;
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswered = false;

    window.onload = () => {
      updateHighScoreDisplay();
    };

    function getStorageKey() {
      const selectedCat = document.getElementById('cat-select').value;
      return `quizHighScore_Pharma_${selectedCat}`;
    }

    function updateHighScoreDisplay() {
      const key = getStorageKey();
      const highScore = localStorage.getItem(key) || 0;
      document.getElementById('high-score-display').innerText = `この設定の最高得点: ${highScore} / ${QUESTION_COUNT}点`;
    }

    function startQuiz() {
      const selectedCat = document.getElementById('cat-select').value;
      let pool = allQuizData;
      if (selectedCat !== 'all') {
        pool = allQuizData.filter(q => q.category === selectedCat);
      }

      currentQuestions = [...pool].sort(() => 0.5 - Math.random()).slice(0, QUESTION_COUNT);
      currentQuestionIndex = 0;
      score = 0;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');

      showQuestion();
    }

    function showQuestion() {
      isAnswered = false;
      document.getElementById('explanation-box').classList.add('hidden');

      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('progress').innerText = `問題 ${currentQuestionIndex + 1} / ${currentQuestions.length} 【${q.category}】`;
      document.getElementById('question-text').innerText = q.question;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = option;
        btn.onclick = () => checkAnswer(index, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex, selectedBtn) {
      if (isAnswered) return;
      isAnswered = true;

      const q = currentQuestions[currentQuestionIndex];
      const buttons = document.getElementById('options-container').querySelectorAll('button');

      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if (index === q.answerIndex) {
          btn.classList.add('correct-btn');
        } else if (index === selectedIndex) {
          btn.classList.add('wrong-btn');
        }
      });

      const title = document.getElementById('result-title');
      if (selectedIndex === q.answerIndex) {
        title.innerText = "⭕ 正解！";
        title.style.color = "#2e7d32";
        score++;
      } else {
        title.innerText = "❌ 不正解...";
        title.style.color = "#c62828";
      }

      document.getElementById('explanation-text').innerText = q.explanation;
      document.getElementById('explanation-box').classList.remove('hidden');
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuestions.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }

    function triggerPerfectCelebration() {
      const celebration = document.getElementById('perfect-celebration');
      celebration.classList.remove('hidden');
      document.getElementById('result-heading').classList.add('hidden');

      confetti({
        particleCount: 120,
        spread: 100,
        origin: { y: 0.6 },
        colors: ['#00897b', '#ffd700', '#26a69a', '#ff7043', '#29b6f6']
      });

      const duration = 3000;
      const end = Date.now() + duration;

      const frame = () => {
        confetti({
          particleCount: 4,
          angle: 60,
          spread: 55,
          origin: { x: 0, y: 0.75 },
          colors: ['#00897b', '#ffd700', '#ffffff']
        });
        confetti({
          particleCount: 4,
          angle: 120,
          spread: 55,
          origin: { x: 1, y: 0.75 },
          colors: ['#00897b', '#ffd700', '#ffffff']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      };
      frame();
    }

    function finishQuiz() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      document.getElementById('final-score').innerText = `${currentQuestions.length}問中 ${score}問正解！`;

      const key = getStorageKey();
      const currentHighScore = parseInt(localStorage.getItem(key) || 0);
      const msgElement = document.getElementById('new-high-score-msg');

      if (score > currentHighScore) {
        localStorage.setItem(key, score);
        msgElement.innerText = "🎉 最高得点を更新しました！";
        msgElement.classList.remove('hidden');
      } else {
        msgElement.classList.add('hidden');
      }

      if (score === currentQuestions.length) {
        triggerPerfectCelebration();
      } else {
        document.getElementById('perfect-celebration').classList.add('hidden');
        document.getElementById('result-heading').classList.remove('hidden');
      }
    }

    function resetQuiz() {
      updateHighScoreDisplay();
      document.getElementById('perfect-celebration').classList.add('hidden');
      document.getElementById('result-heading').classList.remove('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }
  </script>
